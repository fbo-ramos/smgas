name: Smoke tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          echo "Runner: $(uname -a)"

      - name: Docker Compose up
        run: |
          docker compose up -d --build

      - name: Wait for API readiness
        run: |
          set -e
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/healthz; then
              echo "API ready"; exit 0
            fi
            echo "Waiting for API... ($i)"; sleep 2
          done
          echo "API did not become ready"; exit 1

      - name: Run smoke tests (PowerShell)
        run: |
          pwsh -NoProfile -NonInteractive -File ./scripts/smoke-test.ps1

      - name: Tear down
        if: always()
        run: |
          docker compose down -v
