services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: smgas
      POSTGRES_PASSWORD: smgas_pass
      POSTGRES_DB: smgas_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://smgas:smgas_pass@db:5432/smgas_db?sslmode=disable
      JWT_ACCESS_SECRET: change_me_access_secret
      JWT_REFRESH_SECRET: change_me_refresh_secret
      ACCESS_TOKEN_EXPIRE_MIN: "15"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      PORT: "8080"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL","curl -f http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    name: smgas_pgdata
